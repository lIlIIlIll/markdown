  - '2026-08-18: cjpm test; exit 0; 1410 passed, 0 skipped, 0 error, 0 failed'
  notes: "Assumptions: A-001, A-002, A-004."
- id: MD-GOV-004
  source: PRD §6.3, §10.1-2, §54.8-10
  target: '0.9'
  level: must
  description: AST 是 0.9 的 arena-backed 公共核心抽象并为 1.0 冻结建立基线
  acceptance:
  - 公共主链路为 Source → Document → Transform → Renderer
  - String → HTML 仅作为便利 API，不取代 Document 抽象
  - SourceBuffer、Syntax Representation、Semantic AST 的职责边界明确
  - Event/fused 执行模型不以 AST walk 或能力降级伪装为低分配路径
  status: pass
  implementation:
  - src/profile.cj
  - src/ast.cj
  - src/execution.cj
  - 'src/events.cj: source-driven Resolved and RawBlock events never retain Document or NodeRef; AST-walk events remain excluded'
  - docs/versioning-and-compatibility.md
  tests:
  - 'src/ast_test.cj: AstContractTest.constructsImmutableTypedAstAndValidatesIt'
  - 'src/execution_test.cj: HtmlExecutionTest.preferFallsBackAndRequireFailsClosedForAstSyntax'
  - 'src/events_test.cj: SourceEventApiTest.directSinkAndCumulativeNodeLimitUsePublicContracts'
  evidence:
  - *final_validation_evidence
  - '2026-08-18: cjpm test; exit 0; 1410 passed, 0 skipped, 0 error, 0 failed'
  - '2026-08-27: public API checker tests 9/9 and v0.9 snapshot verification at 1263 declarations after removing the AST-walk event adapter'
  - '2026-08-27: cjpm check; exit 0; arena Document remains the public core and explicit fused execution compiles without capability downgrade'
  notes: "A-036 completes the arena migration; A-037 resolves Event scheduling in favor of frozen PRD §54.10 and forbids a 0.9 AST-walk streaming facade. Assumptions: A-001, A-002, A-004, A-036, A-037."
- id: MD-GOV-005
  source: PRD §8, §29, §53.4-6, §54.14-16, §54.27, §54.33, §54.36
  target: cross-release
  level: must
  description: 非目标和宿主责任边界不会被核心库越权实现或误述
  acceptance:
  - 核心不实现 DOM、完整 sanitizer、代码高亮引擎、WYSIWYG、任意回溯 grammar DSL 或代码执行
  - 核心不访问网络、include 文件或图片，也不执行公式、图表、脚本
  - 外部 JSON/YAML 方言保持纯数据且不携带代码回调；Transform、CST、Event 和编辑器能力按显式 capability/version 提供，不冒充默认核心路径
  - 代码扩展明确拥有宿主进程权限，不宣称处于 sandbox
  - Front Matter 只提取原文，Math 只保留 literal
  status: pass
  implementation:
  - src/profile.cj
  - src/ast.cj
  - docs/versioning-and-compatibility.md
  tests:
  - 'src/document_system_test.cj: DocumentSystemTest.documentGraphUsesOnlyHostSuppliedInputsAndResolvesEdgesAndReferences'
  - 'src/external_descriptor_test.cj: ExternalDialectDescriptorTest.descriptorsRejectCallbacksUnknownFieldsInvalidSchemaAndUnboundedRules'
  - 'src/isolation_test.cj: PluginIsolationTest.isolationPolicyIpcIdentityLimitsCancellationAndFailClosedAreEnforced'
  - 'src/official_extensions_test.cj: OfficialExtensionsTest.frontMatterAndMathAreLiteralOnlyAndHeadingIdsAreStructured'
  evidence:
  - *final_validation_evidence
  - '2026-08-18: cjpm test; exit 0; 1410 passed, 0 skipped, 0 error, 0 failed'
  notes: "Assumptions: A-001, A-002, A-004."
- id: MD-USE-001
  source: PRD §9.1-6
  target: cross-release
  level: must
  description: 公共能力组合覆盖应用、终端、文档、IDE、Agent 和静态站点核心场景
  acceptance:
  - 不可信 Markdown 可解析为 AST 并以 Safe HTML 输出
  - 终端可用 Plain Text/自定义 Renderer DSL，P1 可用官方 ANSI/TUI renderer
  - 文档工具可提取标题、链接、图片、代码块、引用和 custom nodes
  - IDE 能力按版本提供 SourceSpan/UTF-16，并演进到 token、format、snapshot 和增量能力
  - Agent 场景支持 raw HTML 禁用、危险 URI 拒绝、取消、节点/输出预算和确定性文本
  - 静态站点可组合自定义方言、AST transform、renderer hooks、containers 和可验证 cache artifact
  status: pass
  implementation:
  - src/facade.cj
  - src/services.cj
  - src/editor.cj
  tests:
  - 'src/facade_test.cj: FacadeTest.convenienceApisAreProfileAwareAndSafeByDefault'
  - 'src/traversal_test.cj: TraversalQueryTest.typedVisitorAndQueriesReturnExactNodesAndRelations'
  - 'src/editor_test.cj: EditorSnapshotTest.snapshotAppliesValidatedUtf8AndUtf16Edits'
  - 'examples/quickstart/src/main.cj'
  evidence:
