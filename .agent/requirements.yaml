  - '2026-08-25: socket-enabled full cjpm test; exit 0; 1417 passed, 0 skipped/error/failed; prerelease, build metadata, incomplete, leading-zero, empty-identifier and overflow cases passed'
  notes: "Assumptions: A-001, A-002, A-003, A-004, A-032."
- id: MD-SYN-001
  source: PRD §6.4, §13.1, §54.12, §54.15, §54.17-18
  target: '1.0'
  level: must
  description: Syntax DSL 只表达受约束、有界、确定的常见 Markdown 扩展
  acceptance:
  - 支持成对 inline、单 token inline、行首 block、container block、literal block、metadata suffix 和属性捕获
  - 不支持任意递归 grammar、任意回溯正则、动态脚本、无界 lookahead 或无界 capture
  - 规则可静态验证并可纳入 fingerprint
  status: pass
  implementation:
  - 'src/extension.cj: bounded paired-inline and container-block typed syntax rules'
  - 'src/parser.cj: compiled custom inline/block dispatch'
