  - 拒绝 SPI 不满足、rule ID/delimiter/block opener 冲突
  - 拒绝无界 lookahead、不支持嵌套和不确定 tie-break
  - 拒绝缺失 renderer 或 capability 声明不完整
  - 失败返回结构化方言或扩展错误
  status: pass
  implementation:
