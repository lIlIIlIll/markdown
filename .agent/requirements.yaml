schema_version: 1
prd:
  path: docs/prd/markdown-library.md
  title: markdown 完整 Markdown 库产品需求文档
  version: '2.1'
  target_product_version: markdown 0.9 breaking pre-GA
  document_status: Draft for Review
  document_date: '2026-08-17'
generated_on: '2026-08-30'
allowed_statuses:
- pending
- implemented_unverified
- pass
- blocked
completion_rule: 只有本文件 requirements 下的全部条目均为 pass，才可声明整个 PRD 完成；blocked、pending 和 implemented_unverified 均不算完成。
final_validation_evidence: &final_validation_evidence '2026-08-30 clean full release gate: cangjie_env; CC=/usr/lib/llvm15/bin/clang AR=ar MARKDOWN_SDK_ARCHIVE_SHA256=6c050802d1d6d297c4c6ad2bf8b253865f33aa2a810f6ef62347162f1e18131d MARKDOWN_BENCHMARK_DRIVER_MODE=canonical scripts/release_gate.sh; exit 0 with Cangjie 1.1.0-alpha.20260829040003; format, docs 44/23/4, native cache contracts 5/5, evidence-bundle tests 3/3, release-evidence tests 15/15, API checker 9/9, public API snapshot 1322, check/build, native ASan+UBSan fuzz 10000, benchmark profiles 7/7, full tests 1456/1456 with zero skipped/error/failed, CommonMark 652/652, GFM 671/671, CLI, quickstart, cookbook, differential 25/24/1/0, benchmark smoke 3/3, package bundle and evidence-ready verifier all passed. target/release-evidence/manifest.json binds the exact clean execution commit/tree and SDK archive SHA-256, derives all counts from retained files and is covered by target/release-evidence/SHA256SUMS. Canonical release performance is separately bound to Server SDK 1.1.0-alpha.20260803040049, product commit 72bd6faaeea5e7921432c3e1d25f79064e747d95 and raw SHA-256 b2942f744ce93a88f5043c5e29fb73df3f9f7cfed230d3868602b0b765f71c29.'
status_definitions:
  pending: 尚未开始，或尚无足以证明实现存在的证据。
  implemented_unverified: 实现已存在，但尚未完成该条目全部验收或证据尚不充分。
  pass: 全部 acceptance 均通过，且 implementation、tests、evidence 已填写可复核证据。
  blocked: 存在已确认且无法在当前授权或环境内解除的阻塞；notes 必须说明阻塞原因和解除条件。
requirements:
- id: MD-GOV-001
  source: PRD §1, §4, §54.1-7
  target: '1.0'
  level: must
  description: 产品身份、标准基线和默认策略固定且可查询
  acceptance:
  - 项目名为 markdown，公开根命名空间为 markdown
  - CommonMark 精确基线为 0.31.2，GFM 精确基线为 0.29-gfm
  - 另提供明确标识为项目组合的 gfm-modern-v1
  - 默认 parser profile 为 commonmark-0.31.2，默认 HTML policy 为 Safe
  - 公开文档和 capability introspection 不使用语义可漂移的 Markdown latest
  status: pass
  implementation:
  - 'cjpm.toml: product package metadata and public markdown module'
  - 'src/profile.cj: versioned built-in profiles and Safe HTML policy identity'
  tests:
  - 'src/core_test.cj: CoreContractTest.freezesVersionedProfilesAndSafeDefault'
  evidence:
  - *final_validation_evidence
  - '2026-08-18: cjpm test; exit 0; 1410 passed, 0 skipped, 0 error, 0 failed'
  - '2026-08-25: repository, product, package, public namespace, CLI command, historical reports and ledger consistently use markdown; legacy product-name scan returned zero matches'
  notes: "Assumptions: A-001, A-002, A-004, A-020, A-022."
- id: MD-GOV-002
  source: PRD §6.1, §11.4, §48.3, §54.3-6
  target: cross-release
  level: must
  description: 版本化 profile 和便利别名在兼容期内保持稳定
  acceptance:
  - 每个标准版本使用新的 profile ID，已发布 profile 的语义不静默改变
  - 1.x 内 commonMark() 和 gfm() 便利别名的目标固定
  - 规范修复关联规范章节或测试编号，并附 regression 与 changelog
  - 影响 AST 的修复评估是否需要新的 profile revision
  status: pass
  implementation:
  - src/profile.cj
  - src/ast.cj
  - docs/versioning-and-compatibility.md
  tests:
  - 'src/core_test.cj: CoreContractTest.freezesVersionedProfilesAndSafeDefault'
  - 'src/profile_snapshot_test.cj: ProfileBehaviorSnapshotTest.gfmModernV1FreezesItsDeclaredExtensionComposition'
  evidence:
  - *final_validation_evidence
  - '2026-08-18: cjpm test; exit 0; 1410 passed, 0 skipped, 0 error, 0 failed'
  notes: "Assumptions: A-001, A-002, A-004."
- id: MD-GOV-003
  source: PRD §6.2, §24.1, §54.7, §54.30-31
  target: '1.0'
  level: must
  description: 规范兼容输出和安全输出是显式分离的策略
  acceptance:
  - SpecCompatible、GfmCompatible 和 Safe 是不同类型或显式构造器
  - 规范测试不通过含糊的 renderHtml() 与不可信内容安全渲染共用隐式策略
  - Safe 为便利 API 默认策略且默认转义 raw HTML
  - GFM tagfilter 不被描述为完整 sanitizer
  status: pass
  implementation:
  - 'src/profile.cj: distinct SpecCompatible, GfmCompatible, and Safe policy kinds'
  tests:
  - 'src/core_test.cj: CoreContractTest.freezesVersionedProfilesAndSafeDefault'
