  - 1.0 不提供外部 JSON/YAML 方言代码回调、Transform DSL、完整 CST、Event API 或真正增量解析
  - 代码扩展明确拥有宿主进程权限，不宣称处于 sandbox
  - Front Matter 只提取原文，Math 只保留 literal
