- id: MD-DIA-002
  source: PRD §12.2-3, §54.19
  target: '1.0'
  level: must
  description: 方言在 engine build 阶段编译为不可变执行计划
  acceptance:
  - 编译流程包含 schema 校验、依赖解析、冲突检测、规范化、排序和 dispatch table 编译
  - CompiledMarkdownDialect 不可变
  - 运行时 parser 不在每次 parse 时重新解释 DSL
  - 核心公开类型覆盖 dialect descriptor、fingerprint、plan version、rule 和 extension implementation identity
  status: pass
  implementation:
  - 'src/extension.cj: DialectCompiler and immutable CompiledMarkdownDialect dispatch arrays'
  - 'src/parser.cj: parser consumes compiled rules rather than interpreting builders'
