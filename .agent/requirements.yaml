  target: '1.0'
  level: must
  description: 规范兼容输出和安全输出是显式分离的策略
  acceptance:
  - SpecCompatible、GfmCompatible 和 Safe 是不同类型或显式构造器
  - 规范测试不通过含糊的 renderHtml() 与不可信内容安全渲染共用隐式策略
  - Safe 为便利 API 默认策略且默认转义 raw HTML
