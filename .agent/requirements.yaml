schema_version: 1
prd:
  path: docs/prd/markdown-library.md
  title: markdown 完整 Markdown 库产品需求文档
  version: '2.0'
  target_product_version: markdown 1.0
  document_status: Draft for Review
  document_date: '2026-08-17'
generated_on: '2026-08-17'
allowed_statuses:
- pending
- implemented_unverified
- pass
- blocked
completion_rule: 只有本文件 requirements 下的全部条目均为 pass，才可声明整个 PRD 完成；blocked、pending 和 implemented_unverified 均不算完成。
status_definitions:
  pending: 尚未开始，或尚无足以证明实现存在的证据。
  implemented_unverified: 实现已存在，但尚未完成该条目全部验收或证据尚不充分。
  pass: 全部 acceptance 均通过，且 implementation、tests、evidence 已填写可复核证据。
  blocked: 存在已确认且无法在当前授权或环境内解除的阻塞；notes 必须说明阻塞原因和解除条件。
requirements:
- id: MD-GOV-001
  source: PRD §1, §4, §54.1-7
  target: '1.0'
  level: must
  description: 产品身份、标准基线和默认策略固定且可查询
  acceptance:
  - 项目名为 markdown，公开根命名空间为 markdown
  - CommonMark 精确基线为 0.31.2，GFM 精确基线为 0.29-gfm
  - 另提供明确标识为项目组合的 gfm-modern-v1
  - 默认 parser profile 为 commonmark-0.31.2，默认 HTML policy 为 Safe
  - 公开文档和 capability introspection 不使用语义可漂移的 Markdown latest
  status: pass
  implementation:
  - 'cjpm.toml: product package metadata and public markdown module'
  - 'src/profile.cj: versioned built-in profiles and Safe HTML policy identity'
  tests:
  - 'src/core_test.cj: CoreContractTest.freezesVersionedProfilesAndSafeDefault'
  evidence:
  - '2026-08-18: cjpm test; exit 0; 1410 passed, 0 skipped, 0 error, 0 failed'
  - '2026-08-25: repository, product, package, public namespace, CLI command, historical reports and ledger consistently use markdown; legacy product-name scan returned zero matches'
  notes: ''
