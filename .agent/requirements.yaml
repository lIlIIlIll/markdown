- id: MD-DIA-003
  source: PRD §12.4-5, §53.8, §54.20
  target: '1.0'
  level: must
  description: 方言、引擎和 renderer fingerprint 完整、分层且确定
  acceptance:
  - DialectFingerprint 包含基础 profile、方言 ID/版本、parser options、扩展语义/实现版本、SPI、规范化规则、顺序和 plan version
  - fingerprint 排除自身字段，采用 canonical serialization → SHA-256
  - 语义相同配置产生相同 fingerprint
  - EngineFingerprint 额外包含 source policy、diagnostic policy 和影响结果的 limits
  - RendererFingerprint 包含 renderer kind、policy 和 renderer extension versions
  status: pass
  implementation:
  - 'src/extension.cj: canonical descriptor includes dialect/profile/extensions/rules/SPI/plan identity'
  - 'src/fingerprint.cj: length-prefixed CanonicalDescriptor plus pure-std SHA-256'
  - 'src/renderer.cj, src/artifact.cj, src/binary_artifact.cj: renderer, engine and binary AST digests use the same unambiguous field encoding'
  tests:
  - 'src/fingerprint_test.cj: sha256MatchesKnownVectors'
  - 'src/fingerprint_test.cj: dialectFingerprintIsDeterministicAndSemanticChangesAlterIt'
  - 'src/fingerprint_test.cj: canonicalFingerprintEncodingHasNoDelimiterOrFieldSplitCollisions'
  - 'src/renderer_test.cj: rendererFingerprintIsDeterministicAndPolicySensitive'
  evidence:
  - *final_validation_evidence
  - '2026-08-18: cjpm test; exit 0; 1410 passed, 0 skipped, 0 error, 0 failed'
  - '2026-08-25: full socket-enabled cjpm test; exit 0; 1413 passed, including delimiter, Unicode, empty-field, manifest-order and rule-order fingerprint cases'
  notes: "Assumptions: A-001, A-002, A-003, A-004, A-028."
- id: MD-DIA-004
  source: PRD §12.6, §51.2
  target: '1.0'
  level: must
  description: 方言编译静态拒绝不完整、不兼容、无界或不确定配置
  acceptance:
