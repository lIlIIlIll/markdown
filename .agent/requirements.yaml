  - '2026-08-18: cjpm test; exit 0; 1410 passed, 0 skipped, 0 error, 0 failed'
  notes: "Assumptions: A-001, A-002, A-004."
- id: MD-ARCH-001
  source: PRD §10.1-2, §55
  target: '1.0'
  level: must
  description: 实现完整、有界、可取消且可验证的 Markdown 数据流
