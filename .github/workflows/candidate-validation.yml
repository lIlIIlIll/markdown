name: Candidate validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-sdk-matrix:
    name: Candidate validation (${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: minimum-1.1.0
            url: https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.0.tar.gz&objectKey=69e9d50c21f5a8178d6fd219
            sha256: 5ce7e8c8523aad9cf5965f818249e1a39f10788963aef7c5852697a3ac964060
            benchmark-driver-mode: compatibility
          - sdk: current-1.1.3
            url: https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a19349d21f5a8178d6fd22b
            sha256: 2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a
            benchmark-driver-mode: canonical
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install declared Cangjie SDK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 '${{ matrix.url }}' --output /tmp/cangjie-sdk.tar.gz
          echo '${{ matrix.sha256 }}  /tmp/cangjie-sdk.tar.gz' | sha256sum --check --strict
          mkdir -p /tmp/cangjie-sdk
          tar -xf /tmp/cangjie-sdk.tar.gz -C /tmp/cangjie-sdk
          env_file="$(find /tmp/cangjie-sdk -name envsetup.sh -type f -print -quit)"
          test -n "${env_file}"
          echo "CANGJIE_ENV_FILE=${env_file}" >> "${GITHUB_ENV}"

      - name: Validate candidate
        shell: bash
        run: |
          set -eo pipefail
          source "${CANGJIE_ENV_FILE}"
          set -u
          CC=clang AR=ar \
            MARKDOWN_BENCHMARK_DRIVER_MODE='${{ matrix.benchmark-driver-mode }}' \
            scripts/release_gate.sh
