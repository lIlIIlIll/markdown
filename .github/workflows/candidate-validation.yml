name: Candidate validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-sdk-matrix:
    name: Candidate validation (${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: sts-1.2.0
            url: https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.2.0.tar.gz&objectKey=6ab1e26eece1f87ff5befa73
            sha256: 8c5fd944cd9cc51ee63d4a240e3ecc4f540345dae1468e8b47c927ecf2ba998f
            benchmark-driver-mode: canonical
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure temporary paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'TMPDIR=%s\n' "${RUNNER_TEMP}"
            printf 'TMP=%s\n' "${RUNNER_TEMP}"
            printf 'TEMP=%s\n' "${RUNNER_TEMP}"
            printf 'CANGJIE_SDK_ARCHIVE=%s/cangjie-sdk-linux-x64-1.2.0.tar.gz\n' "${RUNNER_TEMP}"
          } >> "${GITHUB_ENV}"

      - name: Install declared Cangjie SDK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 '${{ matrix.url }}' --output "${CANGJIE_SDK_ARCHIVE}"
          printf '%s  %s\n' '${{ matrix.sha256 }}' "${CANGJIE_SDK_ARCHIVE}" | sha256sum --check --strict
          sdk_dir="${RUNNER_TEMP}/cangjie-sdk"
          mkdir -p "${sdk_dir}"
          tar -xf "${CANGJIE_SDK_ARCHIVE}" -C "${sdk_dir}"
          env_file="$(find "${sdk_dir}" -name envsetup.sh -type f -print -quit)"
          test -n "${env_file}"
          echo "CANGJIE_ENV_FILE=${env_file}" >> "${GITHUB_ENV}"

      - name: Validate candidate
        shell: bash
        run: |
          set -eo pipefail
          source "${CANGJIE_ENV_FILE}"
          set -u
          CC=clang AR=ar \
            MARKDOWN_SDK_ARCHIVE_SHA256='${{ matrix.sha256 }}' \
            MARKDOWN_BENCHMARK_DRIVER_MODE='${{ matrix.benchmark-driver-mode }}' \
            scripts/release_gate.sh

      - name: Diagnose compiler backend failure
        if: failure()
        shell: bash
        run: |
          set -eo pipefail
          source "${CANGJIE_ENV_FILE}"
          bash scripts/diagnose_cangjie_backend.sh

      - name: Upload compiler diagnostics
        if: failure()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiler-diagnostics-${{ matrix.sdk }}
          path: target/compiler-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release evidence
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-evidence-${{ matrix.sdk }}
          path: target/release-evidence
          if-no-files-found: error
          retention-days: 90

  same-language-benchmark:
    name: Same-language benchmark (sts-1.2.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure temporary paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'TMPDIR=%s\n' "${RUNNER_TEMP}"
            printf 'TMP=%s\n' "${RUNNER_TEMP}"
            printf 'TEMP=%s\n' "${RUNNER_TEMP}"
            printf 'CANGJIE_SDK_ARCHIVE=%s/cangjie-sdk-linux-x64-1.2.0.tar.gz\n' "${RUNNER_TEMP}"
          } >> "${GITHUB_ENV}"

      - name: Download pinned Cangjie SDK 1.2.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.2.0.tar.gz&objectKey=6ab1e26eece1f87ff5befa73' \
            --output "${CANGJIE_SDK_ARCHIVE}"
          printf '%s  %s\n' '8c5fd944cd9cc51ee63d4a240e3ecc4f540345dae1468e8b47c927ecf2ba998f' "${CANGJIE_SDK_ARCHIVE}" | \
            sha256sum --check --strict

      - name: Run same-language benchmark gate
        shell: bash
        run: |
          set -eo pipefail
          unset CPLUS_INCLUDE_PATH C_INCLUDE_PATH COMPILER_PATH CPATH
          unset DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH GLIBC_TUNABLES LD_AUDIT
          unset LD_LIBRARY_PATH LD_PRELOAD LIBRARY_PATH MALLOC_ARENA_MAX MALLOC_CONF
          unset MALLOC_MMAP_THRESHOLD_ MALLOC_PERTURB_ MALLOC_TRIM_THRESHOLD_
          unset MARKDOWN_NATIVE_ARFLAGS MARKDOWN_NATIVE_CFLAGS TARGET
          unset cjGCInterval cjHeapSize
          set -u
          python3 scripts/test_verify_committed_benchmark.py
          python3 benchmarks/test_compare_markdown4cj.py
          mkdir -p target/same-language-benchmark
          CC=clang AR=ar python3 scripts/build_native_scanner.py \
            --enable --target x86_64-unknown-linux-gnu
          python3 scripts/build_benchmark_driver.py --mode canonical --build-cli \
            --identity-output target/same-language-benchmark/build-identity.json \
            --sdk-url \
              'https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.2.0.tar.gz&objectKey=6ab1e26eece1f87ff5befa73' \
            --sdk-sha256 \
              '8c5fd944cd9cc51ee63d4a240e3ecc4f540345dae1468e8b47c927ecf2ba998f' \
            --sdk-archive "${CANGJIE_SDK_ARCHIVE}" \
            --sdk-extract-dir "${RUNNER_TEMP}/cangjie-sdk-verified" \
            --target x86_64-unknown-linux-gnu
          mkdir -p target/same-language-benchmark/toolchain
          cp "${CANGJIE_SDK_ARCHIVE}" \
            target/same-language-benchmark/toolchain/cangjie-sdk-linux-x64-1.2.0.tar.gz
          python3 benchmarks/compare_markdown4cj.py \
            --tools-root "${RUNNER_TEMP}/markdown-same-language-tools" \
            --workspace "${RUNNER_TEMP}/markdown4cj-adapter" \
            --binary-root target/same-language-benchmark/binaries \
            --build-identity target/same-language-benchmark/build-identity.json \
            --output target/same-language-benchmark/markdown4cj-comparison-raw.json \
            --markdown-report target/same-language-benchmark/markdown4cj-comparison.md
          mkdir -p target/same-language-benchmark/comparator-sources
          git -C "${RUNNER_TEMP}/markdown-same-language-tools/markdown4cj" bundle create \
            "${GITHUB_WORKSPACE}/target/same-language-benchmark/comparator-sources/markdown4cj.bundle" \
            HEAD
          git -C "${RUNNER_TEMP}/markdown-same-language-tools/commonmark4cj" bundle create \
            "${GITHUB_WORKSPACE}/target/same-language-benchmark/comparator-sources/commonmark4cj.bundle" \
            HEAD
          mkdir -p target/same-language-benchmark/product-source
          git bundle create \
            target/same-language-benchmark/product-source/markdown.bundle HEAD
          offline_root="${RUNNER_TEMP}/markdown-same-language-offline"
          mkdir -p "${offline_root}"
          git archive HEAD | tar -x -C "${offline_root}"
          python3 "${offline_root}/benchmarks/compare_markdown4cj.py" \
            --source target/same-language-benchmark/comparator-sources/markdown4cj.bundle \
            --commonmark4cj-source target/same-language-benchmark/comparator-sources/commonmark4cj.bundle \
            --product-source target/same-language-benchmark/product-source/markdown.bundle \
            --binary-root target/same-language-benchmark/binaries \
            --sdk-archive target/same-language-benchmark/toolchain/cangjie-sdk-linux-x64-1.2.0.tar.gz \
            --verify-report target/same-language-benchmark/markdown4cj-comparison-raw.json \
            --markdown-report target/same-language-benchmark/markdown4cj-comparison.md \
            --require-current-product

      - name: Verify committed canonical same-language evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 scripts/verify_committed_benchmark.py --download \
            --work-dir "${RUNNER_TEMP}/markdown-committed-evidence"

      - name: Preserve evidence executable modes
        if: always()
        shell: bash
        run: |
          if test -d target/same-language-benchmark; then
            tar -cf target/same-language-benchmark.tar -C target/same-language-benchmark .
          fi

      - name: Upload same-language benchmark evidence
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: same-language-benchmark-sts-1.2.0
          path: target/same-language-benchmark.tar
          if-no-files-found: error
          retention-days: 90
